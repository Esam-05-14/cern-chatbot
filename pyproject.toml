[project]
name = "cerngitlab-mcp"
version = "0.3.0"
description = "MCP server for CERN GitLab - code discovery, documentation access, and usage examples for HEP projects"
readme = "README.md"
authors = [
    { name = "Mohamed Elashri", email = "mohamed.elashri@cern.ch" }
]
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
keywords = ["mcp", "gitlab", "cern", "hep", "physics", "lhc", "root", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "PyJWT>=2.8.0",
    "aiofiles>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/MohamedElashri/cerngitlab-mcp"
Repository = "https://github.com/MohamedElashri/cerngitlab-mcp"
Issues = "https://github.com/MohamedElashri/cerngitlab-mcp/issues"
Changelog = "https://github.com/MohamedElashri/cerngitlab-mcp/blob/main/docs/CHANGELOG.md"
Icon = "https://raw.githubusercontent.com/MohamedElashri/cerngitlab-mcp/main/icons/icon.svg"

[project.scripts]
cerngitlab-mcp = "cerngitlab_mcp.server:main"
cerngitlab-mcp-stdio = "cerngitlab_mcp.server:main_stdio"
cerngitlab-mcp-http = "cerngitlab_mcp.server:main_http"
cerngitlab-cli = "cerngitlab_mcp.cli.main:main"
cerngitlab-chat = "cerngitlab_chat.cli:main"
cerngitlab-chat-index = "cerngitlab_chat.rag.index_cli:main"

[project.optional-dependencies]
chat = [
    "pydantic-ai>=2.0.0",
]
rag = [
    "pydantic-ai>=2.0.0",
    "openai>=1.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["cerngitlab_mcp", "cerngitlab_chat"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "pre-commit>=4.0.0",
    "mypy>=1.13.0",
]
chat = [
    "pydantic-ai>=2.0.0",
]
rag = [
    "pydantic-ai>=2.0.0",
    "openai>=1.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
